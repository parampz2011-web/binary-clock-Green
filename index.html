<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Clock</title>
<style>
  body {
    background-color: black;
    color: lime;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  canvas {
    background-color: black;
  }
  #toggleButton {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="clockCanvas" width="600" height="400"></canvas>
<button id="toggleButton">Show Digital Clock</button>

<script>
const canvas = document.getElementById("clockCanvas");
const ctx = canvas.getContext("2d");

let showClock = false;

// Draw the binary clock
function drawClock() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const w = canvas.width;
    const h = canvas.height;

    // spacing
    const startX = w * 0.2;
    const startY = h * 0.2;
    const spacingX = w * 0.08;
    const spacingY = h * 0.08;
    const r = Math.min(w, h) * 0.02;

    const now = new Date();
    const digits = [
        Math.floor(now.getHours() / 10), now.getHours() % 10,
        Math.floor(now.getMinutes() / 10), now.getMinutes() % 10,
        Math.floor(now.getSeconds() / 10), now.getSeconds() % 10
    ];

    // draw circles
    for (let col = 0; col < 6; col++) {
        const binary = digits[col].toString(2).padStart(4, '0');
        for (let row = 0; row < 4; row++) {
            const x = startX + col * spacingX;
            const y = startY + (3 - row) * spacingY;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, 2 * Math.PI);
            if (binary[row] === "1") {
                ctx.fillStyle = "lime";
                ctx.fill();
            }
            ctx.strokeStyle = "lime";
            ctx.stroke();
        }
    }

    // title
    ctx.fillStyle = "white";
    ctx.font = `${w * 0.04}px Arial`;
    ctx.textAlign = "center";
    ctx.fillText("Binary Clock", w / 2, h * 0.08);

    // digital clock
    if (showClock) {
        ctx.fillStyle = "lime";
        ctx.font = `${w * 0.06}px Arial`;
        ctx.fillText(
            now.toLocaleTimeString('en-US', { hour12: false }),
            w / 2, h * 0.75
        );
    }

    requestAnimationFrame(drawClock);
}

// Button toggle
document.getElementById("toggleButton").addEventListener("click", () => {
    showClock = !showClock;
    document.getElementById("toggleButton").textContent = showClock ? "Hide Digital Clock" : "Show Digital Clock";
});

drawClock();
</script>

</body>
</html>
