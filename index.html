<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Binary Clock</title>
<style>
  body {
    background: black;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }
  canvas {
    background: black;
    display: block;
    margin: 0 auto;
  }
  button {
    font-size: 20px;
    padding: 10px 20px;
    margin-top: 10px;
    cursor: pointer;
  }
  #digitalTime {
    font-size: 60px;
    color: lime;
    height: 70px;
    margin: 10px 0 0 0;
  }
</style>
</head>
<body>

<h1 style="color:white;">Binary Clock</h1>
<canvas id="clockCanvas" width="400" height="300"></canvas>
<p id="digitalTime"></p>
<button id="toggleBtn">Show Digital Clock</button>

<script>
const canvas = document.getElementById('clockCanvas');
const ctx = canvas.getContext('2d');
const toggleBtn = document.getElementById('toggleBtn');
const digitalTime = document.getElementById('digitalTime');

let showDigital = false;
toggleBtn.addEventListener('click', () => {
    showDigital = !showDigital;
    toggleBtn.innerText = showDigital ? "Hide Digital Clock" : "Show Digital Clock";
});

const xPositions = [80, 130, 180, 230, 280, 330];
const yPositions = [80, 110, 140, 170];

function drawLED(x, y, on) {
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fillStyle = on ? 'lime' : 'black';
    ctx.strokeStyle = 'lime';
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
}

function digitToBinary(digit) {
    return digit.toString(2).padStart(4, '0').split('').map(Number);
}

function drawClock() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const now = new Date(); // ALWAYS get exact current time
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const digits = [Math.floor(h/10), h%10, Math.floor(m/10), m%10, Math.floor(s/10), s%10];

    for (let col = 0; col < digits.length; col++) {
        const bin = digitToBinary(digits[col]);
        for (let row = 0; row < 4; row++) {
            if ((col === 0 && row < 2) || (col === 2 && row === 0) || (col === 4 && row === 0)) continue;
            drawLED(xPositions[col], yPositions[row], bin[row] === 1);
        }
    }

    digitalTime.innerText = showDigital ? 
        `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}` 
        : '';

    requestAnimationFrame(drawClock); // perfect sync
}

drawClock(); // start animation
</script>

</body>
</html>
